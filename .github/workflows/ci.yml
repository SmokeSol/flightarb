name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # The engine itself. No network, no optional packages -- if this fails, the
  # logic broke, not a fare.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache the free datasets
        uses: actions/cache@v4
        with:
          path: data
          key: datasets-${{ hashFiles('src/flightarb/geo/datasets.py') }}

      - name: Fetch datasets
        run: python -m flightarb.cli data --refresh

      - name: Offline test suite
        run: python -m pytest -q -m "not network"

  # Live carrier API. Allowed to fail: a third party being down is not a bug in
  # this repository, but we want to see it turn red when it happens.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m flightarb.cli data --refresh
      - name: Bring-up check
        run: python -m flightarb.cli doctor
      - name: Live carrier tests
        run: python -m pytest -q -m network
      - name: Real end-to-end search
        run: |
          python -m flightarb.cli search Casablanca Malaga \
            --depart $(date -u -d "+40 days" +%Y-%m-%d) \
            --return $(date -u -d "+44 days" +%Y-%m-%d) \
            --adults 2 --children 2 --checked-bags 1 \
            --flex 3 --max-origin-minutes 240 --quiet

  # The multi-airline adapter is written but has never run on the author's
  # machine, because the package was not installed there. This job is the only
  # thing that proves it imports, constructs and returns usable offers.
  discovery:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,discovery]"
      - run: python -m flightarb.cli data --refresh

      - name: What does the installed fast-flights actually expose?
        run: |
          python - <<'PY'
          import dataclasses, inspect, traceback
          import fast_flights as ff
          from datetime import date, timedelta

          print("=== model module ===")
          for mod in (ff.model, ff.parser):
              print("--", mod.__name__)
              for n in dir(mod):
                  o = getattr(mod, n)
                  if dataclasses.is_dataclass(o):
                      print(f"   {n}: {[f.name for f in dataclasses.fields(o)]}")

          print()
          print("=== live call ===")
          when = (date.today() + timedelta(days=40)).isoformat()
          try:
              q = ff.create_query(
                  flights=[ff.FlightQuery(date=when, from_airport="MAD", to_airport="AGP")],
                  passengers=ff.Passengers(adults=1), currency="EUR", seat="economy",
                  trip="one-way", max_stops=1)
              res = ff.get_flights(q)
              print("items:", len(res), "metadata:", getattr(res, "metadata", None))
              for i, f in enumerate(res[:3]):
                  print(f"--- item {i}: {type(f).__name__}")
                  print("   repr:", repr(f)[:400])
                  d = getattr(f, "__dict__", None)
                  if d:
                      for k, v in d.items():
                          print(f"   .{k} = {v!r}"[:220])
                  for m in [m for m in dir(f) if not m.startswith("_")]:
                      if d and m in d: continue
                      try:
                          v = getattr(f, m)
                          if not callable(v): print(f"   .{m} = {v!r}"[:220])
                      except Exception: pass
          except Exception:
              traceback.print_exc()
          PY

      - name: fast-flights adapter is usable
        run: |
          python - <<'PY'
          import sys
          from datetime import date, timedelta
          from flightarb.policy import Policy
          from flightarb.runtime import Runtime
          from flightarb.providers.base import SearchQuery
          from flightarb.models import Cabin

          rt = Runtime.build(policy=Policy.default(), db_path=None,
                             providers=["fast-flights"])
          if not rt.registry.providers:
              print("UNAVAILABLE:", rt.registry.skipped)
              sys.exit(1)

          p = rt.registry.providers[0]
          when = date.today() + timedelta(days=40)
          offers = p.search(SearchQuery("MAD", "AGP", when, None, seats=1,
                                        cabin=Cabin.ECONOMY, max_stops=1))
          print(f"{len(offers)} offers returned")
          for o in offers[:5]:
              print(f"  {o.route_label} {o.depart:%Y-%m-%d %H:%M} "
                    f"{o.carriers} EUR {o.price_eur} stops={o.stops}")
          if not offers:
              sys.exit("adapter returned nothing -- upstream shape may have changed")
          bad = [o for o in offers if o.price_eur <= 0 or o.duration_min <= 0]
          if bad:
              sys.exit(f"{len(bad)} offers failed sanity checks")
          PY

      - name: Real search using multi-airline discovery
        run: |
          python -m flightarb.cli search Madrid Malaga \
            --depart $(date -u -d "+40 days" +%Y-%m-%d) \
            --adults 1 --providers fast-flights --quiet
